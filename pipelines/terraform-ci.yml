trigger: none

pr:
  branches:
    include:
      - main
      - trunk
      - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: landing-zone-vars
  - name: serviceConnection
    value: 'Azure-ARM-Service-Connection'
  - name: environment
    value: 'dev'

stages:
  - stage: CI
    jobs:
      - job: ValidateAndPlan
        steps:
          - checkout: self
          
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'
              
          - script: |
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'
            
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd environments/$(environment)
                terraform init -backend-config="resource_group_name=$(backendRg)" -backend-config="storage_account_name=$(backendStorage)" -backend-config="container_name=$(backendContainer)" -backend-config="key=$(environment).terraform.tfstate"
                
          - script: |
              cd environments/$(environment)
              terraform validate
            displayName: 'Terraform Validate'
            
          - template: templates/gitleaks.yml
          
          - script: |
              curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
              tfsec .
            displayName: 'Terraform Security Scan (tfsec)'
            
          - template: templates/infracost.yml
          
          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd environments/$(environment)
                terraform plan -out=tfplan
                
          - publish: environments/$(environment)/tfplan
            artifact: tfplan-$(environment)-ci
            displayName: 'Publish Plan Artifact'
