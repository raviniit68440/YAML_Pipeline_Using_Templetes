parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string

jobs:
  - job: Plan
    steps:
      - checkout: self
      
      - task: TerraformInstaller@1
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: 'latest'
          
      - task: AzureCLI@2
        displayName: 'Terraform Init and Plan'
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            cd environments/${{ parameters.environment }}
            terraform init -backend-config="resource_group_name=$(backendRg)" -backend-config="storage_account_name=$(backendStorage)" -backend-config="container_name=$(backendContainer)" -backend-config="key=${{ parameters.environment }}.terraform.tfstate"
            terraform plan -out=tfplan
            
      - publish: environments/${{ parameters.environment }}/tfplan
        artifact: tfplan-${{ parameters.environment }}
        displayName: 'Publish Plan Artifact'
