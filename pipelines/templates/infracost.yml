steps:
  - script: |
      curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
      infracost configure set api_key $(infracostApiKey)
      
      # Generate Infracost report
      infracost breakdown --path . --format html --out-file infracost-report.html
    displayName: 'Infracost Setup and Scan'
    
  - publish: infracost-report.html
    artifact: InfracostReport
    displayName: 'Publish Infracost Report'
